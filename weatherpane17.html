<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Advanced Weather Dashboard</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
  height:100vh;
}

.dashboard{
  display:grid;
  grid-template-rows:70px 1fr 190px;
  gap:10px;
  padding:10px;
  height:100vh;
}

.header{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;

  display:grid;
  grid-template-columns:minmax(0,1fr) 46px;
  gap:10px;
  align-items:center;

  padding:8px 10px 8px 16px;
}

.header-main{
  min-width:0;
  cursor:pointer;
}

.header-view{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-width:0;
  width:100%;
  white-space:nowrap;
}

.header-view.active{
  display:flex;
}

.header-overview.active{
  display:grid;
  grid-template-columns:
    minmax(78px,0.5fr)
    minmax(190px,2.1fr)
    minmax(64px,0.55fr)
    minmax(48px,0.4fr)
    minmax(48px,0.4fr)
    minmax(120px,1fr);
  align-items:center;
  column-gap:22px;
}

.header-conditions.active{
  display:grid;
  grid-template-columns:repeat(5,minmax(76px,1fr));
  align-items:center;
  column-gap:18px;
}

.header-primary{
  display:flex;
  align-items:baseline;
  gap:20px;
  min-width:0;
}

.header-location{
  font-size:24px;
  font-weight:800;
  line-height:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}

.header-temp{
  font-size:36px;
  font-weight:900;
  line-height:1;
}

.header-secondary{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:18px;
  flex:0 0 auto;
}

.header-secondary .metric-value{
  opacity:0.88;
}

.header-overview .metric{
  text-align:left;
}

.header-overview .header-temp,
.header-overview .metric:nth-last-child(-n + 3){
  text-align:center;
}

.header-weather-summary{
  text-align:right;
}

.header-support-metric .metric-value,
.header-weather-summary .metric-value{
  font-size:22px;
  opacity:0.86;
}

.header-weather-summary .metric-value{
  overflow:hidden;
  text-overflow:ellipsis;
}

.setup-indicator{
  width:36px;
  height:36px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.setup-indicator:hover{
  background:rgba(255,255,255,0.18);
}

.metric{
  text-align:center;
  min-width:0;
}

.metric-label{
  font-size:12px;
  opacity:0.7;
  white-space:nowrap;
}

.metric-value{
  font-size:24px;
  font-weight:bold;
  white-space:nowrap;
}

.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  min-height:0;
}

.panel{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  overflow:hidden;
  min-height:0;
}

.map-panel{
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.cloud-tile-layer{
  filter:brightness(1.08) contrast(1.75) saturate(0.65);
  mix-blend-mode:normal;
}

.location-crosshair{
  width:27px;
  height:27px;
  position:relative;
}

.location-crosshair::before,
.location-crosshair::after{
  content:"";
  position:absolute;
  background:#ff1f1f;
  border-radius:2px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.9),
    0 0 7px rgba(255,31,31,0.95),
    0 0 12px rgba(0,0,0,0.85);
}

.location-crosshair::before{
  left:12px;
  top:0;
  width:3px;
  height:27px;
}

.location-crosshair::after{
  left:0;
  top:12px;
  width:27px;
  height:3px;
}

#radarCountdown{
  position:absolute;
  top:12px;
  right:12px;

  z-index:2000;

  background:rgba(7,17,31,0.82);

  border:1px solid rgba(255,255,255,0.12);

  backdrop-filter:blur(6px);

  padding:6px 10px;

  border-radius:10px;

  font-size:12px;
  font-weight:600;

  color:white;

  letter-spacing:0.4px;

  pointer-events:none;

  box-shadow:0 4px 14px rgba(0,0,0,0.35);
}

.charts{
  display:grid;

  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;

  gap:10px;
  padding:10px;

  height:100%;
  min-height:0;
}

.chart-card{
  background:rgba(255,255,255,0.05);
  border-radius:14px;
  padding:10px;

  display:flex;
  flex-direction:column;

  min-height:0;
}

.chart-title{
  font-size:13px;
  margin-bottom:6px;
  opacity:0.9;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.chart-title > span:first-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chart-title-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}

.chart-next-label{
  min-width:34px;
  padding:2px 6px;
  border:1px solid rgba(255,255,255,0.16);
  border-radius:6px;
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.76);
  font-size:10px;
  font-weight:bold;
  line-height:1.4;
  text-align:center;
}

.chart-expand-btn{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  width:20px;
  height:20px;
  border-radius:4px;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
  opacity:0.7;
}

.chart-expand-btn:hover{
  background:rgba(255,255,255,0.2);
  border-color:rgba(255,255,255,0.3);
  opacity:1;
}

.chart-container{
  position:relative;
  flex:1;
  min-height:0;
}

.forecast-strip{
  display:grid;
  gap:10px;
  height:100%;
}

.forecast-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:8px;
  cursor:pointer;
}

.forecast-card:hover{
  background:rgba(255,255,255,0.09);
}

.forecast-layout{
  display:grid;
  grid-template-columns:46px minmax(0,1fr) 46px;
  gap:10px;
  height:100%;
}

.forecast-panel-stack{
  min-width:0;
  height:100%;
}

.forecast-toggle-btn{
  width:46px;
  height:100%;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.forecast-toggle-btn:hover{
  background:rgba(255,255,255,0.18);
}

.forecast-day{
  opacity:0.7;
  margin-bottom:4px;
  font-size:13px;
}

.forecast-icon{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:4px;
}

.forecast-weather-symbol{
  font-family:'Material Symbols Outlined';
  font-weight:normal;
  font-style:normal;
  font-size:28px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  -webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'liga';
  color:#ffd166;
}

.forecast-weather-symbol-stack{
  position:relative;
  display:inline-block;
  width:30px;
  height:30px;
  line-height:1;
}

.forecast-weather-symbol-stack .forecast-weather-symbol{
  position:absolute;
}

.forecast-weather-symbol-stack .forecast-weather-base{
  top:-1px;
  left:-1px;
  font-size:25px;
  opacity:0.92;
}

.forecast-weather-symbol-stack .forecast-weather-condition{
  right:-2px;
  bottom:-1px;
  font-size:22px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.55));
}

.forecast-weather-cloud-cover{
  position:relative;
  display:inline-block;
  width:32px;
  height:30px;
  line-height:1;
}

.forecast-weather-cloud-cover .forecast-weather-symbol{
  position:absolute;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.48));
}

.cloud-cover-base{
  color:#ffd166;
}

.cloud-cover-cloud,
.cloud-cover-cloud-secondary{
  color:#cbd5e1;
}

.cloud-cover-mostly-sunny .cloud-cover-base,
.cloud-cover-partly-sunny .cloud-cover-base{
  left:0;
  top:0;
  font-size:27px;
}

.cloud-cover-mostly-sunny .cloud-cover-cloud{
  right:1px;
  bottom:1px;
  font-size:15px;
}

.cloud-cover-partly-sunny .cloud-cover-cloud{
  right:-1px;
  bottom:-1px;
  font-size:21px;
}

.cloud-cover-partly-cloudy .cloud-cover-base{
  left:1px;
  top:0;
  font-size:20px;
}

.cloud-cover-partly-cloudy .cloud-cover-cloud{
  right:-2px;
  bottom:-1px;
  font-size:25px;
}

.cloud-cover-mostly-cloudy .cloud-cover-base{
  left:1px;
  top:1px;
  font-size:17px;
}

.cloud-cover-mostly-cloudy .cloud-cover-cloud{
  right:-2px;
  bottom:-1px;
  font-size:26px;
}

.cloud-cover-mostly-cloudy .cloud-cover-cloud-secondary,
.cloud-cover-cloudy .cloud-cover-cloud-secondary{
  left:0;
  bottom:1px;
  font-size:21px;
  opacity:0.9;
}

.cloud-cover-cloudy .cloud-cover-cloud{
  right:0;
  top:1px;
  font-size:28px;
}

.forecast-summary{
  font-size:10px;
  text-align:center;
  opacity:0.85;
  min-height:28px;
  line-height:1.2;
  margin-bottom:4px;
}

.forecast-temp{
  font-size:18px;
  font-weight:bold;
}

.forecast-low{
  font-size:11px;
  opacity:0.7;
  margin-top:2px;
}

.forecast-daily-meta{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  line-height:1.15;
}

.forecast-daily-meta span{
  display:block;
}

.forecast-daily-precip{
  color:rgba(255,255,255,0.86);
}

.forecast-precip{
  width:100%;
  margin-top:4px;
  padding-top:4px;
  border-top:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.78);
  font-size:10px;
  line-height:1.15;
  text-align:center;
  white-space:normal;
}

.forecast-hourly-card .forecast-precip{
  margin-top:5px;
  font-size:10px;
}

canvas{
  width:100% !important;
  height:100% !important;
}

.zip-search{
  display:flex;
  align-items:center;
  gap:6px;
}

.chart-span-control{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}

.chart-span-control label{
  font-size:12px;
  opacity:0.7;
  white-space:nowrap;
}

.chart-span-control select{
  height:36px;
  border-radius:10px;
  border:none;
  padding:0 28px 0 10px;
  background:#1a2433;
  color:white;
  outline:none;
  cursor:pointer;
}

.zip-search input{
  width:90px;
  height:36px;
  border-radius:10px;
  border:none;
  padding:0 10px;
  background:#1a2433;
  color:white;
  outline:none;
}

.zip-search button{
  height:36px;
  padding:0 14px;
  border:none;
  border-radius:10px;
  background:#33d1ff;
  color:#07111f;
  font-weight:bold;
  cursor:pointer;
}

.zip-status{
  grid-column:2;
  color:#ffb4b4;
  font-size:11px;
  min-height:14px;
  margin-top:-4px;
}

.settings-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:9000;
  align-items:flex-start;
  justify-content:center;
  padding-top:84px;
  backdrop-filter:blur(4px);
}

.settings-overlay.active{
  display:flex;
}

.settings-popup{
  width:min(420px, calc(100vw - 28px));
  background:rgba(10,24,43,0.96);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;
  padding:16px;
  box-shadow:0 18px 48px rgba(0,0,0,0.45);
}

.settings-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.settings-title span{
  font-size:15px;
  font-weight:bold;
}

.settings-close{
  width:30px;
  height:30px;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  font-size:18px;
}

.settings-field{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:12px;
  align-items:center;
  margin-top:12px;
}

.settings-field > label{
  font-size:12px;
  opacity:0.72;
}

.settings-field .chart-span-control,
.settings-field .zip-search{
  width:100%;
}

.settings-field .chart-span-control select{
  width:100%;
}

.settings-field .zip-search input{
  flex:1;
  width:auto;
}

.settings-screen{
  display:none;
}

.settings-screen.active{
  display:block;
}

.settings-nav-btn{
  width:100%;
  min-height:38px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.settings-nav-btn:hover{
  background:rgba(255,255,255,0.18);
}

.settings-back-btn{
  width:30px;
  height:30px;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  font-size:18px;
  margin-right:8px;
}

.settings-title-left{
  display:flex;
  align-items:center;
  min-width:0;
}

.current-panel-settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.chart-panel-settings{
  grid-template-columns:1fr;
}

.current-panel-group{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:12px;
}

.current-panel-heading{
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
  opacity:0.82;
}

.chart-panel-heading-btn{
  width:100%;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:none;
  background:transparent;
  color:white;
  cursor:pointer;
  padding:0;
  text-align:left;
}

.chart-panel-heading-main{
  min-width:0;
}

.chart-panel-heading-title{
  display:block;
  font-size:12px;
  font-weight:bold;
  opacity:0.9;
}

.chart-panel-heading-summary{
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:normal;
  opacity:0.62;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chart-panel-heading-icon{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:6px;
  background:rgba(255,255,255,0.1);
  flex:0 0 auto;
}

.chart-panel-options{
  margin-top:10px;
}

.chart-panel-options.collapsed{
  display:none;
}

.parameter-option{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:28px;
  font-size:12px;
}

.parameter-option input{
  accent-color:#33d1ff;
}

.parameter-option span{
  flex:1;
  min-width:0;
}

.parameter-size-select{
  width:78px;
  min-height:26px;
  border:1px solid rgba(255,255,255,0.16);
  border-radius:7px;
  background:rgba(7,17,31,0.92);
  color:white;
  font-size:11px;
  padding:0 6px;
}

.parameter-order-actions{
  display:flex;
  gap:4px;
}

.parameter-order-btn{
  width:24px;
  height:24px;
  border:none;
  border-radius:6px;
  background:rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  line-height:1;
}

.parameter-order-btn:hover:not(:disabled){
  background:rgba(255,255,255,0.18);
}

.parameter-order-btn:disabled{
  cursor:default;
  opacity:0.28;
}

.settings-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.settings-action-btn{
  min-height:34px;
  border:none;
  border-radius:9px;
  padding:0 12px;
  background:#33d1ff;
  color:#07111f;
  font-weight:bold;
  cursor:pointer;
}

.current-fixed-metric{
  text-align:left;
}

.header-main{
  height:100%;
}

.header-freeform-panel.active{
  display:block;
}

.header-freeform-panel{
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
}

.header-draggable-metric{
  position:absolute;
  left:50%;
  top:50%;
  cursor:grab;
  user-select:none;
  touch-action:none;
  border-radius:10px;
  padding:6px 8px;
  transform:translate(-50%,-50%);
  transition:
    background 0.18s,
    opacity 0.18s,
    box-shadow 0.18s;
}

.header-draggable-metric:hover{
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 0 1px rgba(255,255,255,0.08);
}

.header-draggable-metric.dragging{
  cursor:grabbing;
  opacity:0.42;
  transform:translate(-50%,-50%) scale(0.98);
  pointer-events:none;
}

.header-draggable-metric .metric-label,
.header-draggable-metric .metric-value{
  line-height:1.08;
}

.header-field-size-small .metric-label{
  font-size:10px;
}

.header-field-size-small .metric-value{
  font-size:18px;
}

.header-field-size-medium .metric-label{
  font-size:12px;
}

.header-field-size-medium .metric-value{
  font-size:24px;
}

.header-field-size-large .metric-label{
  font-size:14px;
}

.header-field-size-large .metric-value{
  font-size:32px;
}

.modal-overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  z-index:10000;
  backdrop-filter:blur(4px);
}

.modal-overlay.active{
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal-content{
  position:relative;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;
  padding:20px;
  width:90%;
  height:80%;
  max-width:1200px;
}

.modal-close-btn{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  width:36px;
  height:36px;
  border-radius:8px;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10001;
  transition:all 0.2s;
}

.modal-close-btn:hover{
  background:rgba(255,255,255,0.2);
  border-color:rgba(255,255,255,0.3);
}

#modalCanvas{
  width:100% !important;
  height:100% !important;
  cursor:ew-resize;
  touch-action:none;
}

.day-modal-content{

<script>

// ======================================
// CONFIG
// ======================================

const GOOGLE_WEATHER_API_KEY =
  "AIzaSyABWmHcA4PPyj6gAZ-Ctn0nt8yxT8GnvRI";

const DEFAULT_LOCATION = {

  lat:35.9799,
  lon:-78.5097,
  name:'Wake Forest, NC'

};

// ======================================
// MAP
// ======================================

const map = L.map(
  'map'
).setView(
  [DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon],
  7
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

const locationCrosshairIcon = L.divIcon({

  className:'',
  html:'<div class="location-crosshair"></div>',
  iconSize:[27,27],
  iconAnchor:[13,13]

});

const locationCrosshairMarker = L.marker(
  [DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon],
  {
    icon:locationCrosshairIcon,
    interactive:false,
    keyboard:false,
    zIndexOffset:1000
  }
).addTo(map);

function updateLocationCrosshair(lat,lon){

  locationCrosshairMarker.setLatLng(
    [lat,lon]
  );

}

// ======================================
// MAP WEATHER LAYERS
// ======================================

let radarLayer = null;
let cloudLayer = null;
let activeMapWeatherLayer = 'radar';
let radarCloudRefreshIntervalSeconds = 300;

function createRadarLayer(){

  return L.tileLayer.wms(

    'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q.cgi',

    {

      layers:'nexrad-n0q-900913',

      format:'image/png',

      transparent:true,

      _t:Date.now(),

      opacity:0.72

    }

  );

}

function createCloudLayer(){

  return L.tileLayer(

    `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/goes_east_conus_ch02/{z}/{x}/{y}.png?_t=${Date.now()}`,

    {

      className:'cloud-tile-layer',
      opacity:0.62

    }

  );

}

function removeMapWeatherLayers(){

  if(radarLayer){

    map.removeLayer(
      radarLayer
    );

    radarLayer = null;

  }

  if(cloudLayer){

    map.removeLayer(
      cloudLayer
    );

    cloudLayer = null;

  }

}

function updateMapWeatherLayer(){

  removeMapWeatherLayers();

  if(activeMapWeatherLayer === 'clouds'){

    cloudLayer =
      createCloudLayer();

    cloudLayer.addTo(map);

  }
  else{

    radarLayer =
      createRadarLayer();

    radarLayer.addTo(map);

  }

  updateRadarCountdown();

}

function toggleMapWeatherLayer(){

  activeMapWeatherLayer =
    activeMapWeatherLayer === 'radar'
      ? 'clouds'
      : 'radar';

  updateMapWeatherLayer();

  radarRefreshSeconds =
    radarCloudRefreshIntervalSeconds;

  updateRadarCountdown();

}

map.on(
  'click',
  toggleMapWeatherLayer
);

// ======================================
// MAP WEATHER LAYER TIMER
// ======================================

let radarRefreshSeconds =
  radarCloudRefreshIntervalSeconds;

function updateRadarCountdown(){

  const minutes =
    Math.floor(radarRefreshSeconds / 60);

  const seconds =
    radarRefreshSeconds % 60;

  document.getElementById(
    'radarCountdown'
  ).innerText =

    `${activeMapWeatherLayer === 'radar' ? 'Radar' : 'Clouds'} refresh in ${minutes}:${String(seconds).padStart(2,'0')}`;

}

updateMapWeatherLayer();

setInterval(()=>{

  radarRefreshSeconds--;

  if(radarRefreshSeconds <= 0){

    radarRefreshSeconds =
      radarCloudRefreshIntervalSeconds;

    updateMapWeatherLayer();

  }

  updateRadarCountdown();

},1000);

// ======================================
// CHARTS
// ======================================

let tempChart;
let feelsLikeChart;
let heatIndexChart;

let windChart;

function formatChartHour(date){

  return date.toLocaleTimeString(
    'en-US',
    {
      hour:'numeric',
      hour12:true
    }
  )
  .replace(' AM','a')
  .replace(' PM','p');

}

function formatChartDay(date){

  return date.toLocaleDateString(
    'en-US',
    {
      weekday:'short'
    }
  );

}

function getChartTimeTickLimit(){

  if(window.innerWidth <= 820){

    return 5;

  }

  if(window.innerWidth <= 1100){

    return 6;

  }

  return 8;

}

function getChartTimeFontSize(){

  return window.innerWidth <= 820
    ? 9
    : 10;

}

function getChartDates(data,hourlyData=[]){

  const dates = [];

  for(let i=0;i<data.length;i++){

    dates.push(
      new Date(
        hourlyData[i] && hourlyData[i].dt
          ? hourlyData[i].dt * 1000
          : Date.now() + i * 60 * 60 * 1000
      )
    );

  }

  return dates;

}

function getChartLabels(data,hourlyData=[]){

  return getChartDates(
    data,
    hourlyData
  ).map(formatChartHour);

}

function getExpandedChartLabels(data,hourlyData=[]){

  const dates =
    getChartDates(
      data,
      hourlyData
    );

  return dates.map((date,index)=>{

    const hour =
      formatChartHour(date);

    if(
      index === 0 ||
      date.getDate() !== dates[index - 1].getDate() ||
      date.getMonth() !== dates[index - 1].getMonth() ||
      date.getFullYear() !== dates[index - 1].getFullYear()
    ){

      return [
        formatChartDay(date),
        hour
      ];

    }

    return hour;

  });

}

function getDayBoundaryIndexes(data,hourlyData=[]){

  const dates =
    getChartDates(
      data,
      hourlyData
    );

  const boundaries = [];

  for(let i=1;i<dates.length;i++){

    if(
      dates[i].getDate() !== dates[i - 1].getDate() ||
      dates[i].getMonth() !== dates[i - 1].getMonth() ||
      dates[i].getFullYear() !== dates[i - 1].getFullYear()
    ){

      boundaries.push(i);

    }

  }

  return boundaries;

}

function getChartDayRanges(data,hourlyData=[]){

  const dates =
    getChartDates(
      data,
      hourlyData
    );

  const ranges = [];

  if(!dates.length){

    return ranges;

  }

  let startIndex = 0;
  let currentLabel =
    formatChartDay(dates[0]);

  for(let i=1;i<dates.length;i++){

    if(
      dates[i].getDate() !== dates[i - 1].getDate() ||
      dates[i].getMonth() !== dates[i - 1].getMonth() ||
      dates[i].getFullYear() !== dates[i - 1].getFullYear()
    ){

      ranges.push({
        label:currentLabel,
        start:startIndex,
        end:i - 1
      });

      startIndex = i;
      currentLabel =
        formatChartDay(dates[i]);

    }

  }

  ranges.push({
    label:currentLabel,
    start:startIndex,
    end:dates.length - 1
  });

  return ranges;

}

const midnightLinePlugin = {

  id:'midnightLinePlugin',

  afterDraw(chart,args,pluginOptions){

    const indexes =
      pluginOptions && pluginOptions.indexes
        ? pluginOptions.indexes
        : [];

    const dayRanges =
      pluginOptions && pluginOptions.dayRanges
        ? pluginOptions.dayRanges
        : [];

    if(!indexes.length && !dayRanges.length){

      return;

    }

    const xScale =
      chart.scales.x;

    const area =
      chart.chartArea;

    const ctx =
      chart.ctx;

    ctx.save();

    ctx.strokeStyle =
      'rgba(255,255,255,0.32)';

    ctx.lineWidth = 1;

    ctx.setLineDash([4,4]);

    indexes.forEach(index=>{

      const x =
        xScale.getPixelForValue(index);

      ctx.beginPath();
      ctx.moveTo(x, area.top);
      ctx.lineTo(x, area.bottom);
      ctx.stroke();

    });

    ctx.restore();

    if(!dayRanges.length){

      return;

    }

    ctx.save();

    ctx.fillStyle =
      'rgba(255,255,255,0.78)';

    ctx.font =
      '700 12px Arial, sans-serif';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    dayRanges.forEach(range=>{

      const startX =
        xScale.getPixelForValue(range.start);

      const endX =
        xScale.getPixelForValue(range.end);

      const x =
        (startX + endX) / 2;

      ctx.fillText(
        range.label,
        x,
        area.bottom + 28
      );

    });

    ctx.restore();

  }

};

function getSliderCursorLabelText(label){

  if(Array.isArray(label)){

    return label.join(' ');

  }

  return label || '';

}

function formatSliderCursorValue(canvasId,value,datasetLabel=''){

  if(value === null || typeof value === 'undefined' || Number.isNaN(value)){

    return '--';

  }

  const rounded =
    Math.abs(value) >= 10
      ? Math.round(value)
      : Math.round(value * 10) / 10;

  const suffixes = {
    tempChart:'°F',
    feelsLikeChart:'°F',
    heatIndexChart:'°F',
    windChart:' mph',
    humidityChart:'%',
    pressureChart:' hPa',
    uvChart:'',
    cloudCoverChart:'%',
    precipChart:'%',
    rainAmountChart:'"',
    thunderstormChart:'%'
  };

  const suffix =
    suffixes[canvasId] || '';

  return `${datasetLabel ? `${datasetLabel}: ` : ''}${rounded}${suffix}`;

}

const sliderCursorPlugin = {

  id:'sliderCursorPlugin',

  afterDraw(chart,args,pluginOptions){

    if(!pluginOptions || !pluginOptions.enabled){

      return;

    }

    const labels =
      chart.data.labels || [];

    if(!labels.length){

      return;

    }

    const cursor =
      chart.$sliderCursor || {};

    const activeIndex =
      Math.max(
        0,
        Math.min(
          labels.length - 1,
          typeof cursor.activeIndex === 'number'
            ? cursor.activeIndex
            : 0
        )
      );

    const xScale =
      chart.scales.x;

    const area =
      chart.chartArea;

    const x =
      xScale.getPixelForValue(activeIndex);

    const ctx =
      chart.ctx;

    const valueLines =
      chart.data.datasets
        .filter(dataset=>!dataset.hidden)
        .map(dataset=>formatSliderCursorValue(
          pluginOptions.canvasId,
          dataset.data[activeIndex],
          chart.data.datasets.length > 1
            ? dataset.label
            : ''
        ));

    const lines = [
      getSliderCursorLabelText(labels[activeIndex]),
      ...valueLines
    ];

    ctx.save();

    ctx.strokeStyle = 'rgba(255,255,255,0.86)';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x, area.top);
    ctx.lineTo(x, area.bottom);
    ctx.stroke();

    ctx.fillStyle = 'rgba(51,209,255,0.95)';
    ctx.beginPath();
    ctx.arc(x, area.top + 10, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '700 12px Arial, sans-serif';
    const paddingX = 10;
    const paddingY = 8;
    const lineHeight = 16;
    const boxWidth =
      Math.max(
        ...lines.map(line=>ctx.measureText(line).width)
      ) + paddingX * 2;
    const boxHeight =
      lines.length * lineHeight + paddingY * 2;
    const boxX =
      Math.max(
        area.left + 4,
        Math.min(
          x - boxWidth / 2,
          area.right - boxWidth - 4
        )
      );
    const boxY =
      area.top + 14;

    ctx.fillStyle = 'rgba(7,17,31,0.92)';
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(typeof ctx.roundRect === 'function'){

      ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 8);

    }
    else{

      ctx.rect(boxX, boxY, boxWidth, boxHeight);

    }
    ctx.fill();
    ctx.stroke();

    lines.forEach((line,index)=>{

      ctx.fillStyle =
        index === 0
          ? 'rgba(255,255,255,0.92)'
          : 'rgba(255,255,255,0.78)';
      ctx.fillText(
        line,
        boxX + paddingX,
        boxY + paddingY + 11 + index * lineHeight
      );

    });

    ctx.restore();

  }

};

  [
    tempChart,
    feelsLikeChart,
    heatIndexChart,
    windChart,
    humidityChart,

    uvChart,

function createChart(
  id,
  data,
  color,
  type='line',
  hourlyData=[],
  chartOptions={}
){

  const labels =
    getChartLabels(
      data,
      hourlyData
    );

  const datasets =
    [
      {
        label:chartOptions.label || 'Value',
        data:data,
        borderColor:color,
        backgroundColor:color,
        borderWidth:2,
        tension:0.35,
        fill:false
      },
      ...(chartOptions.extraDatasets || [])
    ];

  const chart = new Chart(

    document.getElementById(id),

    {

      type:type,

      data:{

        labels:labels,

        datasets:datasets

      },

      options:{

        responsive:true,
        maintainAspectRatio:false,

        plugins:{
          legend:{
            display:chartOptions.legendDisplay || false,
            labels:{
              color:'rgba(255,255,255,0.72)',
              boxWidth:10,
              boxHeight:10,
              font:{
                size:10
              }
            }
          },
          midnightLinePlugin:{
            indexes:getDayBoundaryIndexes(
              data,
              hourlyData
            )
          }
        },

        scales:{

          x:{

            ticks:{
              color:'rgba(255,255,255,0.6)',
              font:{
                size:getChartTimeFontSize()
              },
              autoSkip:true,
              maxRotation:0,
              minRotation:0,
              maxTicksLimit:getChartTimeTickLimit()
            },

            grid:{
              color:'rgba(255,255,255,0.05)'
            }

          },

          y:{

            ...(chartOptions.y || {}),

            ticks:{
              color:'rgba(255,255,255,0.6)'
            },

            grid:{
              color:'rgba(255,255,255,0.05)'
            }

          }

        }

      }

    }

  );

  // Store chart data for modal
  storeChartData(id, chart);

  return chart;

}

function getChartOption(chartId){

  return CHART_OPTIONS.find(
    chart=>chart.id === chartId
  );

}

function cloneChartPanelSelections(selections){

  return CHART_PANEL_DEFINITIONS.reduce(
    (panelSelections,panel)=>{

      panelSelections[panel.key] =
        selections && Array.isArray(selections[panel.key])
          ? [...selections[panel.key]]
          : [...DEFAULT_CHART_PANEL_SELECTIONS[panel.key]];

      return panelSelections;

    },
    {}
  );

}

function getAvailableChartIds(){

  return CHART_OPTIONS.map(
    chart=>chart.id
  );

}

function normalizeChartPanelSelection(selection,defaults,availableIds){

  const normalized =
    Array.isArray(selection)
      ? selection
        .filter((chartId,index,allIds)=>
          availableIds.includes(chartId) &&
          allIds.indexOf(chartId) === index
        )
      : [];

  return normalized.length
    ? normalized
    : [...defaults];

}

function normalizeChartPanelSelections(selections){

  const availableIds =
    getAvailableChartIds();

  return CHART_PANEL_DEFINITIONS.reduce(
    (panelSelections,panel)=>{

      panelSelections[panel.key] =
        normalizeChartPanelSelection(
          selections && selections[panel.key],
          DEFAULT_CHART_PANEL_SELECTIONS[panel.key],
          availableIds
        );

      return panelSelections;

    },
    {}
  );

}

function loadChartPanelDefaults(){

  try{

    const savedDefaults =
      localStorage.getItem(
        CHART_PANEL_DEFAULTS_STORAGE_KEY
      );

    if(savedDefaults){

      return normalizeChartPanelSelections(
        JSON.parse(savedDefaults)
      );

    }

  }
  catch(err){

    console.log(err);

  }

  return cloneChartPanelSelections(
    DEFAULT_CHART_PANEL_SELECTIONS
  );

}

function saveChartPanelDefaults(){

  try{

    const defaults =
      normalizeChartPanelSelections(
        chartPanelSelections
      );

    localStorage.setItem(
      CHART_PANEL_DEFAULTS_STORAGE_KEY,
      JSON.stringify(defaults)
    );

    chartPanelSelections =
      cloneChartPanelSelections(defaults);

    normalizeChartPanelActiveIndexes();
    updateChartTitles();
    renderChartPanelSettings();

  }
  catch(err){

    console.log(err);

  }

}

function normalizeChartPanelActiveIndexes(){

  CHART_PANEL_DEFINITIONS.forEach(panel=>{

    const selection =
      chartPanelSelections[panel.key];

    if(
      chartPanelActiveIndexes[panel.key] >= selection.length
    ){

      chartPanelActiveIndexes[panel.key] = 0;

    }

  });

}

function getActiveChartId(panelKey){

  const selection =
    chartPanelSelections[panelKey] || [];

  const activeIndex =
    chartPanelActiveIndexes[panelKey] || 0;

  return selection[activeIndex] || selection[0];

}

function getActiveChartCanvasId(panelKey){

  const chart =
    getChartOption(
      getActiveChartId(panelKey)
    );

  return chart
    ? chart.canvasId
    : null;

}

function cycleChartPanel(panelKey){

  const selection =
    chartPanelSelections[panelKey] || [];

  if(selection.length <= 1){

    return;

  }

  chartPanelActiveIndexes[panelKey] =
    ((chartPanelActiveIndexes[panelKey] || 0) + 1) %
    selection.length;

  updateChartTitles();

}

function updateChartPanelDisplay(){

  const usedChartIds = [];

  CHART_OPTIONS.forEach(chart=>{

    const panel =
      document.getElementById(chart.panelId);

    if(panel){

      panel.style.display = 'none';

    }

  });

  CHART_PANEL_DEFINITIONS.forEach(panelDefinition=>{

    let chart =
      getChartOption(
        getActiveChartId(panelDefinition.key)
      );

    if(
      chart &&
      usedChartIds.includes(chart.id)
    ){

      const fallbackChartId =
        (chartPanelSelections[panelDefinition.key] || [])
          .find(chartId=>!usedChartIds.includes(chartId));

      if(fallbackChartId){

        chartPanelActiveIndexes[panelDefinition.key] =
          chartPanelSelections[panelDefinition.key]
            .indexOf(fallbackChartId);

        chart =
          getChartOption(fallbackChartId);

      }

    }

    if(!chart){

      return;

    }

    usedChartIds.push(chart.id);

    const card =
      document.getElementById(
        panelDefinition.cardId
      );

    const panel =
      document.getElementById(chart.panelId);

    if(card && panel){

      card.appendChild(panel);

      panel.style.display =
        chart.display;

    }

  });

}

function getChartTitle(metric){

      ? selection.filter((parameterId,index,allIds)=>
        availableIds.includes(parameterId) &&
        allIds.indexOf(parameterId) === index
      )
      : [];

    ? normalized
    : [...defaults];

function normalizeCurrentWeatherPanelPositions(positions){

  const normalized = {
    first:{},
    second:{}
  };

  ['first','second'].forEach(panelKey=>{

    const panelPositions =
      positions && positions[panelKey];

    if(
      !panelPositions ||
      typeof panelPositions !== 'object'
    ){

      return;

    }

    Object.keys(panelPositions).forEach(positionKey=>{

      const position =
        panelPositions[positionKey];

      if(
        !position ||
        typeof position.x !== 'number' ||
        typeof position.y !== 'number'
      ){

        return;

      }

      normalized[panelKey][positionKey] = {
        x:Math.min(
          100,
          Math.max(0, position.x)
        ),
        y:Math.min(
          100,
          Math.max(0, position.y)
        )
      };

    });

  });

  return normalized;

}

function getClampedHeaderMetricPosition(metric,panel,x,y){

  const panelBounds =
    panel.getBoundingClientRect();

  const metricBounds =
    metric.getBoundingClientRect();

  const edgeInsetPixels = 5;

  const halfWidthPercent =
    panelBounds.width
      ? ((metricBounds.width / 2 + edgeInsetPixels) / panelBounds.width) * 100
      : 0;

  const halfHeightPercent =
    panelBounds.height
      ? ((metricBounds.height / 2 + edgeInsetPixels) / panelBounds.height) * 100
      : 0;

  const minX =
    Math.min(50, halfWidthPercent);

  const maxX =
    Math.max(50, 100 - halfWidthPercent);

  const minY =
    Math.min(50, halfHeightPercent);

  const maxY =
    Math.max(50, 100 - halfHeightPercent);

  return {
    x:Math.min(
      maxX,
      Math.max(minX, x)
    ),
    y:Math.min(
      maxY,
      Math.max(minY, y)
    )
  };

}

function applyHeaderMetricPosition(metric,panel,position){

  metric.style.left =
    `${position.x}%`;

  metric.style.top =
    `${position.y}%`;

  requestAnimationFrame(()=>{

    const clampedPosition =
      getClampedHeaderMetricPosition(
        metric,
        panel,
        position.x,
        position.y
      );

    metric.style.left =
      `${clampedPosition.x}%`;

    metric.style.top =
      `${clampedPosition.y}%`;

  });

}

function renderCurrentWeatherPanel(panelId,panelKey,selection){

  );

    false;

    selection.reduce((parameters,parameterId)=>{

      if(
        (
          parameterId === 'temperature' ||
          parameterId === 'feels_like'
        ) &&
        selection.includes('temperature') &&
        selection.includes('feels_like')
      ){

        if(!hasCombinedTemperature){

          parameters.push({
            parameterId:'temperature_feels_like',
            selectionIds:[
              'temperature',
              'feels_like'
            ]
          });

          hasCombinedTemperature = true;

        }

        return parameters;

      }

      parameters.push({
        parameterId,
        selectionIds:[parameterId]
      });

      return parameters;

    },[]);

  const visibleSelection =
    panelSelection
      .map(item=>({
        ...item,
        parameter:getCurrentWeatherParameter(
          item.parameterId
        )
      }))
      .filter(item=>item.parameter);

  panel.innerHTML = '';

  panel.style.gridTemplateColumns = '';

  visibleSelection.forEach((item,index)=>{

      item.parameter;

      getCurrentPanelFieldSize(

      item.selectionIds.join(',');

      getCurrentPanelPositionKey(item);

function beginCurrentPanelMetricDrag(event,panelKey){

  if(
    event.pointerType === 'mouse' &&
    event.button !== 0
  ){

    return;

  }

  const metric =
    event.currentTarget;

  const panel =
    metric.parentElement;

  if(!panel){

    return;

  }

  activeHeaderMetricDrag = {
    metric,
    panel,
    panelKey,
    startX:event.clientX,
    startY:event.clientY,
    startLeft:parseFloat(metric.style.left) || 50,
    startTop:parseFloat(metric.style.top) || 50,
    moved:false
  };

  metric.setPointerCapture(
    event.pointerId
  );

  metric.addEventListener(
    'pointermove',
    handleCurrentPanelMetricDrag
  );

  metric.addEventListener(
    'pointerup',
    endCurrentPanelMetricDrag
  );

  metric.addEventListener(
    'pointercancel',
    endCurrentPanelMetricDrag
  );

}

function handleCurrentPanelMetricDrag(event){

  if(!activeHeaderMetricDrag){

    return;

  }

  const drag =
    activeHeaderMetricDrag;

  const distance =
    Math.hypot(
      event.clientX - drag.startX,
      event.clientY - drag.startY
    );

  if(distance < 6){

    return;

  }

  event.preventDefault();

  drag.moved = true;
  drag.metric.classList.add('dragging');

  const panelBounds =
    drag.panel.getBoundingClientRect();

  const nextX =
    drag.startLeft +
    (
      panelBounds.width
        ? ((event.clientX - drag.startX) / panelBounds.width) * 100
        : 0
    );

  const nextY =
    drag.startTop +
    (
      panelBounds.height
        ? ((event.clientY - drag.startY) / panelBounds.height) * 100
        : 0
    );

  const nextPosition =
    getClampedHeaderMetricPosition(
      drag.metric,
      drag.panel,
      nextX,
      nextY
    );

  drag.metric.style.left =
    `${nextPosition.x}%`;

  drag.metric.style.top =
    `${nextPosition.y}%`;

}

function endCurrentPanelMetricDrag(event){

  if(!activeHeaderMetricDrag){

    return;

  }

  const drag =
    activeHeaderMetricDrag;

  drag.metric.removeEventListener(
    'pointermove',
    handleCurrentPanelMetricDrag
  );

  drag.metric.removeEventListener(
    'pointerup',
    endCurrentPanelMetricDrag
  );

  drag.metric.removeEventListener(
    'pointercancel',
    endCurrentPanelMetricDrag
  );

  if(
    drag.metric.hasPointerCapture &&
    drag.metric.hasPointerCapture(event.pointerId)
  ){

    drag.metric.releasePointerCapture(
      event.pointerId
    );

  }

  drag.metric.classList.remove('dragging');

  if(drag.moved){

    suppressHeaderToggleUntil =
      Date.now() + 350;

    currentPanelPositions[drag.panelKey][drag.metric.dataset.positionKey] = {
      x:parseFloat(drag.metric.style.left) || 50,
      y:parseFloat(drag.metric.style.top) || 50
    };

    saveCurrentWeatherPanelPositions();

  }

  activeHeaderMetricDrag = null;

}

function moveChartPanelChart(panelKey,chartId,direction){

  const selection =
    chartPanelSelections[panelKey];

  const currentIndex =
    selection.indexOf(chartId);

  if(currentIndex === -1){

    return;

  }

  const nextIndex =
    currentIndex + direction;

  if(
    nextIndex < 0 ||
    nextIndex >= selection.length
  ){

    return;

  }

  const nextSelection =
    [...selection];

  [
    nextSelection[currentIndex],
    nextSelection[nextIndex]
  ] = [
    nextSelection[nextIndex],
    nextSelection[currentIndex]
  ];

  chartPanelSelections[panelKey] =
    nextSelection;

  chartPanelActiveIndexes[panelKey] =
    nextSelection.indexOf(chartId);

  updateChartTitles();
  renderChartPanelSettings();

}

      selection.push(chartId);

    }

  }
  else if(selection.length > 1){

    chartPanelSelections[panelKey] =
      selection.filter(id=>id !== chartId);

  }

  normalizeChartPanelActiveIndexes();
  updateChartTitles();
  renderChartPanelSettings();

function getDayOfYear(date){

  const start =
    new Date(
      date.getFullYear(),
      0,
      0
    );

  return Math.floor(
    (date - start) / 86400000
  );

}

function normalizeDegrees(value){

  return ((value % 360) + 360) % 360;

}

function normalizeHours(value){

  return ((value % 24) + 24) % 24;

}

function calculateSunEvent(date,lat,lon,isSunrise){

  const zenith =
    90.833;

  const dayOfYear =
    getDayOfYear(date);

  const lngHour =
    lon / 15;

  const eventHour =
    isSunrise
      ? 6
      : 18;

  const approximateTime =
    dayOfYear + ((eventHour - lngHour) / 24);

  const meanAnomaly =
    (0.9856 * approximateTime) - 3.289;

  const trueLongitude =
    normalizeDegrees(
      meanAnomaly +
      (1.916 * Math.sin(meanAnomaly * Math.PI / 180)) +
      (0.020 * Math.sin(2 * meanAnomaly * Math.PI / 180)) +
      282.634
    );

  let rightAscension =
    Math.atan(
      0.91764 * Math.tan(trueLongitude * Math.PI / 180)
    ) * 180 / Math.PI;

  rightAscension =
    normalizeDegrees(rightAscension);

  rightAscension +=
    Math.floor(trueLongitude / 90) * 90 -
    Math.floor(rightAscension / 90) * 90;

  rightAscension /= 15;

  const sinDeclination =
    0.39782 * Math.sin(trueLongitude * Math.PI / 180);

  const cosDeclination =
    Math.cos(
      Math.asin(sinDeclination)
    );

  const cosHourAngle =
    (
      Math.cos(zenith * Math.PI / 180) -
      (sinDeclination * Math.sin(lat * Math.PI / 180))
    ) /
    (
      cosDeclination * Math.cos(lat * Math.PI / 180)
    );

  if(cosHourAngle > 1 || cosHourAngle < -1){

    return null;

  }

  let hourAngle =
    Math.acos(cosHourAngle) * 180 / Math.PI;

  if(isSunrise){

    hourAngle =
      360 - hourAngle;

  }

  hourAngle /= 15;

  const localMeanTime =
    hourAngle +
    rightAscension -
    (0.06571 * approximateTime) -
    6.622;

  const utcHours =
    normalizeHours(
      localMeanTime - lngHour
    );

  return new Date(
    Date.UTC(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    ) +
    (utcHours * 60 * 60 * 1000)
  );

}

function isNightForecastHour(timestampSeconds,lat,lon){

  if(
    typeof timestampSeconds !== 'number' ||
    typeof lat !== 'number' ||
    typeof lon !== 'number'
  ){

    return false;

  }

  const forecastDate =
    new Date(
      timestampSeconds * 1000
    );

  let sunrise =
    calculateSunEvent(
      forecastDate,
      lat,
      lon,
      true
    );

  let sunset =
    calculateSunEvent(
      forecastDate,
      lat,
      lon,
      false
    );

  if(!sunrise || !sunset){

    const hour =
      forecastDate.getHours();

    return hour < 6 || hour >= 18;

  }

  if(sunset <= sunrise){

    sunset =
      new Date(
        sunset.getTime() + 86400000
      );

  }

  return forecastDate < sunrise || forecastDate >= sunset;

}

function renderWeatherSymbol(symbol,color,title){

}

function renderStackedWeatherSymbol(conditionSymbol,conditionColor,isNight,title){

  const baseSymbol =
    isNight
      ? 'dark_mode'
      : 'sunny';

  const baseColor =
    isNight
      ? '#c4b5fd'
      : '#ffd166';

  return `
    <span
      class="forecast-weather-symbol-stack"

    >
      <span
        class="forecast-weather-symbol forecast-weather-base"
        style="color:${baseColor};"
        aria-hidden="true"
      >${baseSymbol}</span>
      <span
        class="forecast-weather-symbol forecast-weather-condition"
        style="color:${conditionColor};"
        aria-hidden="true"
      >${conditionSymbol}</span>
    </span>
  `;

}

function renderCloudCoverSymbol(cover,isNight,title){

  const baseSymbol =
    isNight
      ? 'dark_mode'
      : 'sunny';

  const baseColor =
    isNight
      ? '#c4b5fd'
      : '#ffd166';

  const hasBase =
    cover !== 'cloudy';

  const hasSecondaryCloud =
    cover === 'mostly-cloudy' ||
    cover === 'cloudy';

  return `
    <span
      class="forecast-weather-cloud-cover cloud-cover-${cover}"
      title="${title}"
      aria-label="${title}"
    >
      ${
        hasBase
          ? `<span
              class="forecast-weather-symbol cloud-cover-base"
              style="color:${baseColor};"
              aria-hidden="true"
            >${baseSymbol}</span>`
          : ''
      }
      ${
        hasSecondaryCloud
          ? `<span
              class="forecast-weather-symbol cloud-cover-cloud-secondary"
              aria-hidden="true"
            >cloud</span>`
          : ''
      }
      <span
        class="forecast-weather-symbol cloud-cover-cloud"
        aria-hidden="true"
      >cloud</span>
    </span>
  `;

}

function cloudCoverIconType(cloudCover){

  const cover =
    Number(cloudCover);

  if(!Number.isFinite(cover)){

    return null;

  }

  if(cover <= 5){

    return null;

  }

  if(cover <= 25){

    return 'mostly-sunny';

  }

  if(cover <= 50){

    return 'partly-cloudy';

  }

  if(cover <= 85){

    return 'mostly-cloudy';

  }

  return 'cloudy';

}

function getWeatherIcon(weatherMain,weatherDescription='',options={}){

  const weather =
    `${weatherMain || ''} ${weatherDescription || ''}`
      .toLowerCase();

  const isNight =
    !!options.isNight;

  const cloudCoverType =
    cloudCoverIconType(options.cloudCover);

  let symbol =
    isNight
      ? 'dark_mode'
      : 'sunny';

  let color =
    isNight
      ? '#c4b5fd'
      : '#ffd166';

  let useStackedIcon =
    false;

  const title =
    weatherDescription || weatherMain;

  if(
    weather.includes('clear') ||
    weather.includes('sunny')
  ){

    if(cloudCoverType){

      return renderCloudCoverSymbol(
        cloudCoverType,
        isNight,
        title
      );

    }

    if(
      weather.includes('mostly sunny') ||
      weather.includes('mainly sunny')
    ){

      return renderCloudCoverSymbol(
        'mostly-sunny',
        isNight,
        title
      );

    }

    if(
      weather.includes('partly sunny') ||
      weather.includes('partly clear')
    ){

      return renderCloudCoverSymbol(
        'partly-sunny',
        isNight,
        title
      );

    }

  }

  if(
    weather.includes('mostly cloudy') ||
    weather.includes('broken clouds')
  ){

    return renderCloudCoverSymbol(
      'mostly-cloudy',
      isNight,
      title
    );

  }

  if(
    weather.includes('partly cloudy') ||
    weather.includes('few clouds') ||
    weather.includes('scattered clouds')
  ){

    return renderCloudCoverSymbol(
      'partly-cloudy',
      isNight,
      title
    );

  }

  if(weather.includes('thunder')){

    symbol = 'thunderstorm';
    color = '#facc15';
    useStackedIcon = true;

  }
  else if(
    weather.includes('sleet') ||
    weather.includes('hail') ||
    weather.includes('ice')
  ){

    symbol = 'weather_hail';
    color = '#bfdbfe';
    useStackedIcon = true;

  }
  else if(weather.includes('snow')){

    symbol = 'weather_snowy';
    color = '#dbeafe';
    useStackedIcon = true;

  }
  else if(
    weather.includes('fog') ||
    weather.includes('mist') ||
    weather.includes('haze') ||
    weather.includes('smoke')
  ){

    symbol = 'foggy';
    color = '#cbd5e1';
    useStackedIcon = true;

  }
  else if(
    weather.includes('rain') ||
    weather.includes('shower') ||
    weather.includes('drizzle')
  ){

    symbol = 'rainy';
    color = '#60a5fa';

  }
  else if(
    weather.includes('partly') ||
    weather.includes('mostly sunny')
  ){

    return renderCloudCoverSymbol(
      'partly-cloudy',
      isNight,
      title
    );

  }
  else if(
    weather.includes('cloud') ||
    weather.includes('overcast')
  ){

    return renderCloudCoverSymbol(
      cloudCoverType || 'cloudy',
      isNight,
      title
    );

  }
  else if(weather.includes('wind')){

    symbol = 'air';
    color = '#93c5fd';
    useStackedIcon = true;

  }

  if(useStackedIcon){

    return renderStackedWeatherSymbol(
      symbol,
      color,
      isNight,
      title
    );

  }

  return renderWeatherSymbol(
    symbol,
    color,
    title
  );

}

function degToCompass(deg){

  const dirs = [

    'N','NE','E','SE',

    'S','SW','W','NW'

  ];

  return dirs[
    Math.round(deg / 45) % 8
  ];

}

function mmToInches(mm){

  return (mm || 0) / 25.4;

}

function getPrecipAmountInches(weatherPeriod){

  if(!weatherPeriod){

    return 0;

  }

  if(typeof weatherPeriod.qpf_inches === 'number'){

    return weatherPeriod.qpf_inches;

  }

  const rainMm =
    typeof weatherPeriod.rain === 'number'
      ? weatherPeriod.rain
      : (
        weatherPeriod.rain
          ? weatherPeriod.rain['1h'] || weatherPeriod.rain['3h'] || 0
          : 0
      );

  const snowMm =
    typeof weatherPeriod.snow === 'number'
      ? weatherPeriod.snow
      : (
        weatherPeriod.snow
          ? weatherPeriod.snow['1h'] || weatherPeriod.snow['3h'] || 0
          : 0
      );

  return mmToInches(
    rainMm + snowMm
  );

}

function googleWeatherUrl(endpoint,lat,lon,params={}){

  const url =
    new URL(
      `https://weather.googleapis.com/v1/${endpoint}:lookup`
    );

  url.searchParams.set(
    'key',
    GOOGLE_WEATHER_API_KEY
  );

  url.searchParams.set(
    'location.latitude',
    lat
  );

  url.searchParams.set(
    'location.longitude',
    lon
  );

  url.searchParams.set(
    'unitsSystem',
    'IMPERIAL'
  );

  Object.entries(params).forEach(([key,value])=>{

    url.searchParams.set(
      key,
      value
    );

  });

  return url.toString();

}

async function fetchGoogleWeather(endpoint,lat,lon,params){

  const response =
    await fetch(
      googleWeatherUrl(endpoint,lat,lon,params)
    );

  if(!response.ok){

    let detail = '';

    try{

      const errorBody =
        await response.json();

      detail =
        errorBody.error && errorBody.error.message
          ? `: ${errorBody.error.message}`
          : '';

    }
    catch(_err){

      detail = '';

    }

    throw new Error(
      `Google Weather API ${endpoint} failed: ${response.status}${detail}`
    );

  }

  return response.json();

}

async function fetchGoogleWeatherPages(
  endpoint,
  lat,
  lon,
  params,
  collectionKey,
  targetCount
){

  const firstPage =
    await fetchGoogleWeather(
      endpoint,
      lat,
      lon,
      params
    );

  const combinedItems =
    [
      ...(firstPage[collectionKey] || [])
    ];

  let nextPageToken =
    firstPage.nextPageToken;

  while(
    nextPageToken &&
    combinedItems.length < targetCount
  ){

    const nextPage =
      await fetchGoogleWeather(
        endpoint,
        lat,
        lon,
        {
          ...params,
          pageToken:nextPageToken
        }
      );

    combinedItems.push(
      ...(nextPage[collectionKey] || [])
    );

    nextPageToken =
      nextPage.nextPageToken;

  }

  return {
    ...firstPage,
    [collectionKey]:combinedItems.slice(
      0,
      targetCount
    )
  };

}

function conditionText(condition){

  return condition &&
    condition.description &&
    condition.description.text
      ? condition.description.text
      : 'Unknown';

}

function conditionType(condition){

  return condition && condition.type
    ? condition.type.replaceAll('_',' ')
    : conditionText(condition);

}

function temperatureDegrees(value){

  return value && typeof value.degrees === 'number'
    ? value.degrees
    : 0;

}

function windValue(wind,valueName){

  if(!wind){

    return 0;

  }

  const value =
    wind[valueName] ||
    wind[`${valueName}Speed`];

  return value && typeof value.value === 'number'
    ? value.value
    : 0;

}

function windGustValue(period){

  if(!period){

    return 0;

  }

  if(typeof period.wind_gust === 'number'){

    return period.wind_gust;

  }

  const directGust =
    period.windGust ||
    period.wind_gust_speed;

  if(directGust && typeof directGust.value === 'number'){

    return directGust.value;

  }

  const wind =
    period.wind || {};

  const gust =
    wind.gust ||
    wind.windGust ||
    wind.gustSpeed;

  if(gust && typeof gust.value === 'number'){

    return gust.value;

  }

  return windValue(
    wind,
    'speed'
  );

}

function precipProbability(value){

  return value &&
    value.probability &&
    typeof value.probability.percent === 'number'
      ? value.probability.percent / 100
      : 0;

}

function precipQuantityInches(value){

  return value &&
    value.qpf &&
    typeof value.qpf.quantity === 'number'
      ? value.qpf.quantity
      : 0;

}

function percentProbability(value){

  if(typeof value === 'number'){

    return value > 1
      ? value / 100
      : value;

  }

  if(
    value &&
    typeof value.percent === 'number'
  ){

    return value.percent / 100;

  }

  return value &&
    value.probability &&
    typeof value.probability.percent === 'number'
      ? value.probability.percent / 100
      : 0;

}

function thunderstormProbability(hour){

  const directProbability =
    percentProbability(hour.thunderstormProbability);

  if(directProbability){

    return directProbability;

  }

  const precipitationStormProbability =
    hour.precipitation
      ? percentProbability(
        hour.precipitation.thunderstormProbability
      )
      : 0;

  if(precipitationStormProbability){

    return precipitationStormProbability;

  }

  const weatherText =
    conditionText(hour.weatherCondition).toLowerCase();

  return weatherText.includes('thunder')
    ? precipProbability(hour.precipitation)
    : 0;

}

function heatIndexTemperature(temp,humidity){

  if(temp < 80 || humidity < 40){

    return temp;

  }

  const heatIndex =
    -42.379 +
    (2.04901523 * temp) +
    (10.14333127 * humidity) -
    (0.22475541 * temp * humidity) -
    (0.00683783 * temp * temp) -
    (0.05481717 * humidity * humidity) +
    (0.00122874 * temp * temp * humidity) +
    (0.00085282 * temp * humidity * humidity) -
    (0.00000199 * temp * temp * humidity * humidity);

  return Math.round(heatIndex);

}

function normalizeGoogleHour(hour){

  return {

    dt:Math.floor(
      new Date(hour.interval.startTime).getTime() / 1000
    ),
    weather:[
      {
        main:conditionType(hour.weatherCondition),
        description:conditionText(hour.weatherCondition)
      }
    ],
    temp:temperatureDegrees(hour.temperature),
    feels_like:temperatureDegrees(hour.feelsLikeTemperature),
    humidity:hour.relativeHumidity || 0,
    pressure:Math.round(
      hour.airPressure
        ? hour.airPressure.meanSeaLevelMillibars
        : 0
    ),
    uvi:hour.uvIndex || 0,
    is_day:
      typeof hour.isDaytime === 'boolean'
        ? hour.isDaytime
        : undefined,
    pop:precipProbability(hour.precipitation),
    thunderstorm_pop:thunderstormProbability(hour),
    qpf_inches:precipQuantityInches(hour.precipitation),
    wind_speed:windValue(
      hour.wind,
      'speed'
    ),
    wind_gust:windGustValue(hour),
    wind_deg:hour.wind && hour.wind.direction
      ? hour.wind.direction.degrees
      : 0,
    visibility:hour.visibility && hour.visibility.unit === 'MILES'
      ? hour.visibility.distance * 1609.344
      : 0,
    clouds:hour.cloudCover || 0,
    dew_point:temperatureDegrees(hour.dewPoint)

  };

}

function normalizeGoogleDay(day){

  const dayPart =
    day.daytimeForecast || {};

  const nightPart =
    day.nighttimeForecast || {};

  return {

    dt:Math.floor(
      new Date(day.interval.startTime).getTime() / 1000
    ),
    weather:[
      {
        main:conditionType(dayPart.weatherCondition),
        description:conditionText(dayPart.weatherCondition)
      }
    ],
    temp:{
      max:temperatureDegrees(day.maxTemperature),
      min:temperatureDegrees(day.minTemperature)
    },
    feels_like:{
      day:temperatureDegrees(day.feelsLikeMaxTemperature)
    },
    humidity:dayPart.relativeHumidity || nightPart.relativeHumidity || 0,
    pressure:Math.round(
      dayPart.airPressure
        ? dayPart.airPressure.meanSeaLevelMillibars
        : 0
    ),
    uvi:dayPart.uvIndex || 0,
    pop:Math.max(
      precipProbability(dayPart.precipitation),
      precipProbability(nightPart.precipitation)
    ),
    qpf_inches:
      precipQuantityInches(dayPart.precipitation) +
      precipQuantityInches(nightPart.precipitation),
    wind_speed:windValue(
      dayPart.wind,
      'speed'
    ),
    wind_gust:windGustValue(dayPart),
    wind_deg:dayPart.wind && dayPart.wind.direction
      ? dayPart.wind.direction.degrees
      : 0

  };

}

function localDateKey(timestamp){

  const date =
    new Date(timestamp);

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');

}

function alignDailyForecastDays(dailyData){

  const todayKey =
    localDateKey(Date.now());

  const currentAndFutureDays =
    dailyData.filter(day=>
      localDateKey(day.dt * 1000) >= todayKey
    );

  return currentAndFutureDays.length
    ? currentAndFutureDays
    : dailyData;

}

function normalizeGoogleWeatherData(current,hourly,daily){

  const hourlyData =
    (hourly.forecastHours || []).map(
      normalizeGoogleHour
    );

  const dailyData =
    alignDailyForecastDays(
      (daily.forecastDays || []).map(
        normalizeGoogleDay
      )
    );

  return {

    current:{
      weather:[
        {
          main:conditionType(current.weatherCondition),
          description:conditionText(current.weatherCondition)
        }
      ],
      temp:temperatureDegrees(current.temperature),
      feels_like:temperatureDegrees(
        current.feelsLikeTemperature || current.temperature
      ),
      humidity:current.relativeHumidity || 0,
      pressure:Math.round(
        current.airPressure
          ? current.airPressure.meanSeaLevelMillibars
          : 0
      ),
      wind_speed:windValue(
        current.wind,
        'speed'
      ),
      wind_gust:windGustValue(current),
      wind_deg:current.wind && current.wind.direction
        ? current.wind.direction.degrees
        : 0
    },
    hourly:hourlyData,
    daily:dailyData

  };

}

async function loadWeather(lat,lon){

  try{

    if(
      !GOOGLE_WEATHER_API_KEY ||
      GOOGLE_WEATHER_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY'
    ){

      throw new Error(
        'Add your Google Maps Platform API key to GOOGLE_WEATHER_API_KEY.'
      );

    }

    const [
      current,
      hourly,
      daily
    ] = await Promise.all([

      fetchGoogleWeather(
        'currentConditions',
        lat,
        lon
      ),
      fetchGoogleWeatherPages(
        'forecast/hours',
        lat,
        lon,
        {
          hours:EXPANDED_CHART_HOURS,
          pageSize:24
        },
        'forecastHours',
        EXPANDED_CHART_HOURS
      ),
      fetchGoogleWeather(
        'forecast/days',
        lat,
        lon,
        {
          days:9,
          pageSize:9
        }
      )

    ]);

    const data =
      normalizeGoogleWeatherData(
        current,
        hourly,
        daily
      );

    if(!data.hourly.length || !data.daily.length){

      throw new Error(
        'Google Weather API returned incomplete forecast data.'
      );

    }

    latestWeatherData = data;
    currentWeatherStatus =
      data.current.weather[0].description;

    renderCurrentWeatherPanels();

    renderCharts(data);

    renderForecast(data);

  }

  catch(err){

    console.error(err);

    latestWeatherData = null;
    currentWeatherStatus =
      err.message || 'Weather unavailable';

    renderCurrentWeatherPanels();

  }

}

function setModalSliderCursorFromEvent(event){

  if(!modalChartInstance){

    return;

  }

  const chart =
    modalChartInstance;

  const area =
    chart.chartArea;

  const labels =
    chart.data.labels || [];

  if(!labels.length){

    return;

  }

  const rect =
    chart.canvas.getBoundingClientRect();

  const x =
    Math.max(
      area.left,
      Math.min(
        event.clientX - rect.left,
        area.right
      )
    );

  const rawValue =
    chart.scales.x.getValueForPixel(x);

  const proportionalValue =
    area.right === area.left
      ? 0
      : ((x - area.left) / (area.right - area.left)) *
        (labels.length - 1);

  const activeIndex =
    Math.max(
      0,
      Math.min(
        labels.length - 1,
        Math.round(
          Number.isFinite(rawValue)
            ? rawValue
            : proportionalValue
        )
      )
    );

  chart.$sliderCursor = {
    activeIndex:activeIndex
  };

  chart.update('none');

}

function moveModalSliderCursor(direction){

  if(!modalChartInstance){

    return;

  }

  const chart =
    modalChartInstance;

  const labels =
    chart.data.labels || [];

  if(!labels.length){

    return;

  }

  const currentIndex =
    chart.$sliderCursor &&
    typeof chart.$sliderCursor.activeIndex === 'number'
      ? chart.$sliderCursor.activeIndex
      : 0;

  chart.$sliderCursor = {
    activeIndex:Math.max(
      0,
      Math.min(
        labels.length - 1,
        currentIndex + direction
      )
    )
  };

  chart.update('none');

}

function setupModalSliderCursor(modalCanvas){

  modalCanvas.tabIndex = 0;

  modalCanvas.onpointerdown = event=>{

    isModalCursorDragging = true;
    modalCanvas.setPointerCapture(event.pointerId);
    modalCanvas.focus();
    setModalSliderCursorFromEvent(event);

  };

  modalCanvas.onpointermove = event=>{

    if(!isModalCursorDragging){

      return;

    }

    setModalSliderCursorFromEvent(event);

  };

  modalCanvas.onpointerup = event=>{

    isModalCursorDragging = false;

    if(modalCanvas.hasPointerCapture(event.pointerId)){

      modalCanvas.releasePointerCapture(event.pointerId);

    }

  };

  modalCanvas.onpointercancel = ()=>{

    isModalCursorDragging = false;

  };

  modalCanvas.onkeydown = event=>{

    if(event.key === 'ArrowLeft'){

      event.preventDefault();
      moveModalSliderCursor(-1);

    }

    if(event.key === 'ArrowRight'){

      event.preventDefault();
      moveModalSliderCursor(1);

    }

  };

}

function closeChartModal(){

  const modal = document.getElementById('chartModal');

  modal.classList.remove('active');

  isModalCursorDragging = false;

  if(modalChartInstance){

    modalChartInstance.destroy();

    modalChartInstance = null;

  }

}

function getAddressComponent(components,type){

  const match =
    components.find(component=>
      component.types.includes(type)
    );

  return match
    ? match.long_name
    : '';

}

function formatGeocodeName(result,zip){

  const components =
    result.address_components || [];

  const city =
    getAddressComponent(
      components,
      'locality'
    ) ||
    getAddressComponent(
      components,
      'postal_town'
    );

  const state =
    getAddressComponent(
      components,
      'administrative_area_level_1'
    );

  if(city && state){

    return `${city}, ${state}`;

  }

  return result.formatted_address || zip;

}

async function geocodeZipCodeWithGoogle(zip){

  const url =
    new URL(
      'https://maps.googleapis.com/maps/api/geocode/json'
    );

  url.searchParams.set(
    'address',
    zip
  );

  url.searchParams.set(
    'components',
    'country:US'
  );

  url.searchParams.set(
    'key',
    GOOGLE_WEATHER_API_KEY
  );

  const response =
    await fetch(
      url.toString()
    );

  if(!response.ok){

    throw new Error(
      `Google Geocoding API failed: ${response.status}`
    );

  }

  const data =
    await response.json();

  if(data.status !== 'OK' || !data.results.length){

    throw new Error(
      data.error_message || `No location found for ${zip}`
    );

  }

  const result =
    data.results[0];

  return {

    lat:result.geometry.location.lat,
    lon:result.geometry.location.lng,
    name:formatGeocodeName(result,zip)

  };

}

async function geocodeZipCodeWithFallback(zip){

  const response =
    await fetch(
      `https://api.zippopotam.us/us/${encodeURIComponent(zip)}`
    );

  if(!response.ok){

    throw new Error(
      `No location found for ${zip}`
    );

  }

  const data =
    await response.json();

  if(!data.places || !data.places.length){

    throw new Error(
      `No location found for ${zip}`
    );

  }

  const place =
    data.places[0];

  return {

    lat:Number(place.latitude),
    lon:Number(place.longitude),
    name:`${place['place name']}, ${place['state abbreviation']}`

  };

}

async function geocodeZipCode(zip){

  try{

    return await geocodeZipCodeWithGoogle(zip);

  }
  catch(googleErr){

    console.log(googleErr);

    return geocodeZipCodeWithFallback(zip);

  }

}

function setZipStatus(message){

  const status =
    document.getElementById(
      'zipStatus'
    );

  if(status){

    status.innerText =
      message || '';

  }

}

async function changeZipCode(){

  const zip =
    document.getElementById(
      'zipInput'
    ).value.trim();

  if(!zip){

    setZipStatus(
      'Enter a ZIP code.'
    );

    return;

  }

  const zipButton =
    document.getElementById(
      'zipGoButton'
    );

  try{

    setZipStatus(
      'Loading...'
    );

    if(zipButton){

      zipButton.disabled = true;

    }

    const geo =
      await geocodeZipCode(zip);

    currentLat = geo.lat;
    currentLon = geo.lon;

    currentLocationName =
      geo.name || zip;

    renderCurrentWeatherPanels();

    map.setView(
      [geo.lat, geo.lon],
      8
    );

    updateLocationCrosshair(
      geo.lat,
      geo.lon
    );

    await loadWeather(
      geo.lat,
      geo.lon
    );

    setZipStatus('');

    closeSettingsPopup();

  }

  catch(err){

    console.log(err);

    setZipStatus(
      err.message || 'ZIP lookup failed.'
    );

  }

  finally{

    if(zipButton){

      zipButton.disabled = false;

    }

  }

}

let currentLat = DEFAULT_LOCATION.lat;
let currentLon = DEFAULT_LOCATION.lon;

// ======================================
// WEATHER UPDATE
// ======================================

function startWeatherUpdates(){

  if(weatherUpdateTimer){

    clearInterval(
      weatherUpdateTimer
    );

  }

  weatherUpdateTimer =
    setInterval(()=>{

      loadWeather(currentLat, currentLon);

    }, weatherUpdateIntervalMinutes * 60 * 1000);

}

// ======================================
// LOCAL TIME
// ======================================

function updateLocalTime(){

  renderCurrentWeatherPanels();

}

function startLocalTimeUpdates(){

  updateLocalTime();

  setInterval(()=>{

    updateLocalTime();

  }, 60000);

}

// ======================================
// STARTUP
// ======================================

(async function start(){

  startLocalTimeUpdates();

  let lat =
    DEFAULT_LOCATION.lat;

  let lon =
    DEFAULT_LOCATION.lon;

  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(

      async pos=>{

        lat =
          pos.coords.latitude;

        lon =
          pos.coords.longitude;

        currentLat = lat;
        currentLon = lon;

        currentLocationName =
          'Current Location';

        renderCurrentWeatherPanels();

        map.setView(
          [lat,lon],
          7
        );

        updateLocationCrosshair(
          lat,
          lon
        );

        await loadWeather(
          lat,
          lon
        );

        startWeatherUpdates();

      },

      async ()=>{

        currentLat = lat;
        currentLon = lon;

        updateLocationCrosshair(
          lat,
          lon
        );

        await loadWeather(
          lat,
          lon
        );

        startWeatherUpdates();

      }

    );

  }
  else{

    currentLat = lat;
    currentLon = lon;

    updateLocationCrosshair(
      lat,
      lon
    );

    await loadWeather(
      lat,
      lon
    );

    startWeatherUpdates();

  }

})();

</script>
